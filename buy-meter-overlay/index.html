<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NC Buy Meter Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="fx"></canvas>

  <div class="wrap" id="wrap">
    <div class="topRow">
      <div class="title">BUY METER</div>
      <div class="rightText">
        <span class="usd" id="usdText">$0 / $500</span>
        <span class="pct" id="pctText">0%</span>
      </div>
    </div>

    <div class="barOuter">
      <div class="barInner">
        <div class="ticks">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="fill" id="fill"></div>
        <div class="shine"></div>
      </div>
    </div>

    <div class="bottomRow">
      <div class="sub">NINJA CAT ON TWITCH</div>
      <div class="hint" id="hintText">Loading JS…</div>
    </div>
  </div>

  <script>
    // If you see the hint text change, JS is running.
    const GOAL = 500;
    const fillEl = document.getElementById("fill");
    const usdText = document.getElementById("usdText");
    const pctText = document.getElementById("pctText");
    const hintText = document.getElementById("hintText");

    hintText.textContent = "Demo mode running";

    let v = 0;
    setInterval(() => {
      v += 25 + Math.random() * 55;
      if (v > 520) v = 0;

      const pct = Math.min((v / GOAL) * 100, 100);
      fillEl.style.width = pct.toFixed(2) + "%";
      usdText.textContent = `$${v.toFixed(2)} / $${GOAL}`;
      pctText.textContent = `${Math.floor(pct)}%`;
    }, 1200);
  </script>
</body>
</html>

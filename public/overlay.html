<script>
  const alertEl = document.getElementById("alert");
  const imgEl = document.getElementById("img");
  const sound = document.getElementById("sound");

  const POLL_MS = 1000;
  const LAST_ID_KEY = "nc_last_alert_id";

  let audioUnlocked = false;

  function unlockOnce() {
    if (audioUnlocked) return;
    audioUnlocked = true;

    // Prime audio so browsers allow playback later
    sound.volume = 0;
    sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
      sound.volume = 1;
    }).catch(() => {
      sound.volume = 1;
    });

    document.removeEventListener("click", unlockOnce);
  }

  document.addEventListener("click", unlockOnce);

  function triggerAlert(message) {
    alertEl.style.display = "block";

    // cache bust the image so it refreshes cleanly
    imgEl.src = "/public/alert.png?ts=" + Date.now();

    sound.currentTime = 0;
    sound.play().catch(() => {});

    setTimeout(() => {
      alertEl.style.display = "none";
    }, 5000);
  }

  async function poll() {
    try {
      const lastId = localStorage.getItem(LAST_ID_KEY) || "";
      const url = `/poll-alert?lastId=${encodeURIComponent(lastId)}`;

      const r = await fetch(url, { cache: "no-store" });
      const data = await r.json();

      // Server returns null if nothing new
      if (data && data.id) {
        // Save immediately so reloads do not replay
        localStorage.setItem(LAST_ID_KEY, data.id);

        triggerAlert(data.msg || "Ninja Cat Buy!");
      }
    } catch (e) {
      // ignore
    }
    setTimeout(poll, POLL_MS);
  }

  poll();
</script>

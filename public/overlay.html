<!-- overlay v2 -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title></title>

  <style>
    body { margin:0; background:transparent; overflow:hidden; font-family: Arial, sans-serif; }

    #alert {
      position:absolute;
      left:50%;
      top:35%;
      transform:translate(-50%, -50%);
      display:none;
      text-align:center;
      color:white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }

    #img { width:420px; height:auto; border-radius:16px; display:block; }
    #text { margin-top:10px; font-size:44px; }
  </style>
</head>

<body>
  <div id="alert">
    <img id="img" src="/public/alert.png" style="width:420px;border-radius:16px;display:block;">

    
    <audio id="sound" src="/public/Alert.mp3" preload="auto"></audio>
  </div>

  <script>
    const alertEl = document.getElementById("alert");
   const imgEl = document.getElementById("img");

    const sound = document.getElementById("sound");
   

    let lastTs = 0;
    let audioUnlocked = false;

    function unlockOnce() {
      if (audioUnlocked) return;
      audioUnlocked = true;

      sound.volume = 0;
      sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
        sound.volume = 1;
      }).catch(() => {
        sound.volume = 1;
      });

      document.removeEventListener("click", unlockOnce);
    }

    document.addEventListener("click", unlockOnce);

    function triggerAlert(message) {
      
      alertEl.style.display = "block";

      sound.currentTime = 0;
      sound.play().catch(() => {});

      setTimeout(() => {
        alertEl.style.display = "none";
      }, 5000);
    }

    async function poll() {
      try {
        const r = await fetch("/poll-alert", { cache: "no-store" });
        const data = await r.json();

        if (data && data.ts && data.ts > lastTs) {
          lastTs = data.ts;

          // reload image each time in case of caching
         imgEl.src = "/public/alert.png?ts=" + Date.now();



          triggerAlert(data.msg);
        }
      } catch (e) {
        // ignore
      }
    }

    setInterval(poll, 1000);
  </script>
</body>
</html>
